<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Hỗ Trợ Bản Đồ">
  <defs>
    <!-- nền bo góc -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d35"/>
      <stop offset="1" stop-color="#145c4a"/>
    </linearGradient>
    <!-- thân ghim -->
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fe39a"/>
      <stop offset="0.55" stop-color="#1fbf75"/>
      <stop offset="1" stop-color="#15935a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- nền -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- lưới bản đồ mờ trang trí -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <path d="M70 150 H442 M70 256 H442 M70 362 H442"/>
    <path d="M150 70 V442 M256 70 V442 M362 70 V442"/>
  </g>

  <!-- ghim bản đồ -->
  <g filter="url(#shadow)">
    <path d="M256 92
             c-79 0 -143 62 -143 139
             c0 98 128 189 143 189
             c15 0 143 -91 143 -189
             c0 -77 -64 -139 -143 -139 z"
          fill="url(#pin)"/>
    <path d="M256 92
             c-79 0 -143 62 -143 139
             c0 98 128 189 143 189
             c15 0 143 -91 143 -189
             c0 -77 -64 -139 -143 -139 z"
          fill="url(#glow)"/>
    <!-- lỗ tròn -->
    <circle cx="256" cy="231" r="54" fill="#0f3d35"/>
    <circle cx="256" cy="231" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10"/>
  </g>
</svg>
